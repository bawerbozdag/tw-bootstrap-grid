<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>tw-bootstrap-grid</title>
        <meta name="author" content="Baver Bozdağ" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
        <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)" />

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/webp" sizes="32x32" href="/favicon-32x32.webp" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/webp" sizes="48x48" href="/favicon-48x48.webp" />
        <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
        <link rel="icon" type="image/webp" sizes="128x128" href="/favicon-128x128.webp" />
        <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png" />

        <!-- title, description, canonical, social cards and structured data are generated per page by scripts/prerender.mjs -->
        <!--prerender:head-->

        <!-- apply the saved or system theme before first paint to avoid a flash -->
        <script>
            (() => {
                let theme = null;

                try {
                    theme = localStorage.getItem("theme");
                } catch {
                    // storage can be blocked
                }

                if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
