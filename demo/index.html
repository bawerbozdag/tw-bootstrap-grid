        <title>tw-bootstrap-grid | Bootstrap grid for Tailwind CSS</title>

            name="description"
            content="A Tailwind CSS plugin that adds the Bootstrap 12-column grid: rows, columns, gutters, offsets, row-cols and RTL. Works with Tailwind v3.4 and v4."

        <link rel="canonical" href="https://tw-bootstrap-grid.vercel.app/" />
        <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="tw-bootstrap-grid" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:title" content="tw-bootstrap-grid | Bootstrap grid for Tailwind CSS" />
        <meta
            property="og:description"
            content="The Bootstrap 12-column grid as a Tailwind CSS plugin: rows, columns, gutters, offsets, row-cols and RTL. Works with Tailwind v3.4 and v4."

        <meta property="og:url" content="https://tw-bootstrap-grid.vercel.app/" />
        <meta property="og:image" content="https://tw-bootstrap-grid.vercel.app/og-image.png" />

            name="twitter:description"
            content="The Bootstrap 12-column grid as a Tailwind CSS plugin. Works with Tailwind v3.4 and v4."
        />
        <meta name="twitter:image" content="https://tw-bootstrap-grid.vercel.app/og-image.png" />

            name="twitter:image:alt"

        <!--prerender:jsonld-->

        <!-- apply the saved or system theme before first paint to avoid a flash -->
        <script>
            (() => {
                let theme = null;

                try {
                    theme = localStorage.getItem("theme");
                } catch {
                    // storage can be blocked
                }

                if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
